<!doctype html>
<html lang="es">
<head>
  <meta charset="utf8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Portafolio Personal</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
  
  <!-- Enlace a tu archivo CSS externo -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#contenido">Saltar al contenido</a>
<div id="root"></div>
<noscript><p style="padding:2rem;font-family:system-ui">Este portafolio necesita JavaScript para mostrarse.</p></noscript>

<!-- Librerías de dependencias -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { bg: 'var(--bg)', surface: 'var(--surface)', fg: 'var(--fg)', muted: 'var(--muted)', line: 'var(--line)', accent: 'var(--accent)' },
      fontFamily: { display: ['"Bricolage Grotesque"', 'Arial', 'sans-serif'], mono: ['"Geist Mono"', 'ui-monospace', 'monospace'] }
    } }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>

<!-- Enlace a tu archivo JavaScript externo -->
<script src="script.js"></script>

</body>
</html>
